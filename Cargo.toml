[package]
name = "door_tailgate"
version = "0.1.0"
edition = "2021"
description = "Edge-side tailgating detection for badge-controlled doors (offline, real-time)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "door_tailgate"
path = "src/lib.rs"

[[bin]]
name = "edge"
path = "src/bin/edge.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
